<meta charset="utf-8">
<title>Lestari Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF;--bg-end:#FFFFFF;--bg-grad:#FFFFFF;--glass:rgba(255,255,255,.92);
  --surface:#FFFFFF;--surface-2:#F2F7F3;--ink:#14241C;--ink-2:#5A6B62;--line:#DCE7DF;
  --brand:#2D6A4F;--brand-ink:#FFFFFF;--brand-soft:#D8F3DC;--brand-strong:#1B4332;
  --g-brand:#2D6A4F;--g-hero:#2D6A4F;
  --plum:#40916C;--plum-soft:#E8F5E9;
  --sos:#B91C1C;--sos-ink:#FFFFFF;--sos-soft:#FEE2E2;
  --safe:#15803D;--safe-soft:#DCFCE7;--fair:#A16207;--fair-soft:#FEF9C3;
  --caution:#C2410C;--caution-soft:#FFEDD5;--risk:#B91C1C;--risk-soft:#FEE2E2;
  --gold:#D4A017;--gold-soft:#FDF3D3;
  --tint-pink:#F5FAF6;--tint-mint:#F5FAF6;--tint-lilac:#F5FAF6;--tint-orange:#F5FAF6;
  --map-land:#EEF5EF;--map-road:#FFFFFF;--map-water:#CFE8F6;--map-park:#CDEBD1;
  --stage:#FFFFFF;--bezel:#14241C;--shadow:0 10px 30px rgba(20,36,28,.12);
  --card-shadow:0 1px 2px rgba(20,36,28,.05),0 2px 6px rgba(20,36,28,.05);
  --font:'Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Figtree','Noto Sans',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;zoom:.8}
body{height:100%;margin:0;background:var(--stage);color:var(--ink);font:500 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:24px;height:24px}.ic.xl{width:32px;height:32px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.stage{height:100%;display:flex;gap:28px;align-items:center;justify-content:center;padding:16px}
.index{width:290px;max-height:100%;overflow:auto;background:var(--surface);border-radius:24px;padding:18px 14px;box-shadow:var(--shadow)}
.index h2{font:600 24px/1.2 var(--display);padding:0 6px;color:var(--brand)}
.index .sub{color:var(--ink-2);font-size:13px;padding:4px 6px 10px}
.index h3{font:800 11px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);padding:14px 6px 6px}
.index .links{display:flex;flex-wrap:wrap;gap:4px}
.index .links button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--ink)}
.index .links button[aria-current="true"]{background:var(--g-brand);border-color:transparent;color:#fff}
#idxBtn{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:60;border:0;border-radius:999px;background:var(--g-brand);color:#fff;padding:9px 14px;font-weight:800;box-shadow:var(--shadow)}
.phone{width:392px;height:min(844px,100%);border:10px solid var(--bezel);border-radius:48px;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,36,28,.22);flex:none}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 26px 0;font-size:12.5px;font-weight:800;color:var(--ink)}
.status i{display:flex;gap:5px;align-items:center;font-style:normal}
#view:focus{outline:none}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-ms-overflow-style:none}
.view::-webkit-scrollbar{display:none}
@media (max-width:860px){.index{display:none}#idxBtn{display:block}.index.open{display:block;position:fixed;inset:0;z-index:70;width:auto;max-height:none;border-radius:0}}
@media (max-width:520px){.stage{padding:0}.phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}}

.pad{padding:8px 16px 24px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}.stack.sm{gap:6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0;min-height:0}
.h1{font:700 26px/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance}
.h2{font:700 19px/1.25 var(--display);letter-spacing:-.005em}
.h3{font:800 15px/1.3 var(--font)}
.muted{color:var(--ink-2)}
.small{font-size:13px}.xs{font-size:12px}
.eyebrow{font:800 11.5px/1 var(--font);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--card-shadow)}
.card.flat{background:var(--surface-2);border-color:transparent;box-shadow:none}
.hdr{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;position:sticky;top:0;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5;min-height:52px}
.hdr h1{font:700 18px/1.2 var(--display);flex:1;text-align:center;text-wrap:balance}
.hdr-sp{width:48px;flex:none}
.hdr.left h1{text-align:left}
.ibtn{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn:active{background:var(--surface-2)}
.ibtn.solid{background:var(--surface);border:1px solid var(--line)}
.sospill{height:36px;padding:0 13px;border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:.05em;display:flex;align-items:center;gap:5px;flex:none;box-shadow:0 4px 10px rgba(45,106,79,.35)}
.btn{min-height:52px;border-radius:999px;border:1.5px solid transparent;padding:0 20px;font-weight:800;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(45,106,79,.25)}
.btn.soft{background:var(--brand-soft);color:var(--brand-strong)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.dark{background:#14241C;color:#fff}
.btn.sos{background:var(--sos);color:var(--sos-ink)}
.btn.link{background:none;min-height:44px;color:var(--brand-strong);width:auto;padding:0 8px}
.btn.sm{min-height:40px;font-size:14px;width:auto;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:800;font-size:13.5px}
.field input,.field select,.field textarea{min-height:50px;border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 16px;width:100%}
.field textarea{min-height:92px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--ink-2)}
.field .with-ic{position:relative}
.field .with-ic .ic{position:absolute;left:15px;top:15px;color:var(--brand)}
.field .with-ic input{padding-left:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:transparent;color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips.scroll .chip{flex:none}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:999px;background:transparent;font-weight:800;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand-strong);box-shadow:0 1px 3px rgba(20,36,28,.14)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:var(--ts,var(--surface-2));color:var(--t,var(--ink))}
.t-safe{--t:var(--safe);--ts:var(--safe-soft)}.t-fair{--t:var(--fair);--ts:var(--fair-soft)}
.t-caution{--t:var(--caution);--ts:var(--caution-soft)}.t-risk{--t:var(--risk);--ts:var(--risk-soft)}
.t-brand{--t:var(--brand-strong);--ts:var(--brand-soft)}.t-plum{--t:var(--plum);--ts:var(--plum-soft)}.t-mute{--t:var(--ink-2);--ts:var(--surface-2)}
.t-gold{--t:#8A6A0F;--ts:var(--gold-soft)}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg-end) 72%,transparent);padding:20px 16px 16px;display:flex;flex-direction:column;gap:8px;z-index:4}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:56px}
.li:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);display:grid;place-items:center;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--brand-soft);color:var(--brand-strong)}
.avatar.a2{background:var(--plum-soft);color:var(--plum)}.avatar.a3{background:var(--fair-soft);color:var(--fair)}.avatar.a4{background:var(--caution-soft);color:var(--caution)}
.avatar.lg{width:76px;height:76px;font-size:26px;font-family:var(--display)}
.toggle{width:52px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-checked="true"]{background:var(--g-brand)}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#14241C;color:#fff;padding:12px 16px;border-radius:18px;font-weight:700;font-size:14px;z-index:40;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.progress{display:flex;gap:6px;padding:4px 16px 0}
.progress i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.progress i.on{background:var(--g-brand)}
.note{display:flex;gap:10px;background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--ink-2)}
.note .ic{margin-top:1px;color:var(--brand)}
.note.warn{background:var(--fair-soft);color:var(--ink);box-shadow:none}.note.warn .ic{color:var(--fair)}
.note.eco{background:var(--brand-soft);color:var(--ink)}.note.eco .ic{color:var(--brand-strong)}
.note.gold{background:var(--gold-soft);color:var(--ink)}.note.gold .ic{color:#8A6A0F}

.mascot{display:block;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(20,36,28,.18))}
.hero{position:relative;background:var(--g-hero);color:#fff;border-radius:24px;padding:44px 16px 18px;box-shadow:0 10px 24px rgba(45,106,79,.26)}
.hero .mascot{position:absolute;right:-2px;top:-46px;width:118px;height:118px;pointer-events:none}
.hero .eyebrow{color:rgba(255,255,255,.92)}
.hero .btn.link{color:#fff}
.tile-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center}
.tile-ic.g-pink,.tile-ic.g-lilac,.tile-ic.g-orange,.tile-ic.g-mint,.tile-ic.g-blue,.floater.sq.g-pink,.floater.sq.g-orange{background:var(--brand-soft);color:var(--brand-strong)}
.tile-ic.g-red,.floater.sq.g-red{background:var(--sos);color:#fff}
.tile-ic.g-gold{background:var(--gold-soft);color:#8A6A0F}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:800;font-size:11.5px;color:var(--ink);padding:0;min-height:44px}
.banner{position:relative;border-radius:22px;padding:16px;overflow:visible;background:var(--surface-2);color:var(--ink)}
.banner .art{position:absolute;right:8px;top:8px;bottom:8px;width:44%;border-radius:20px;overflow:hidden}
.blob{position:absolute;border-radius:50%;pointer-events:none}
.stagebox{position:relative;display:grid;place-items:center;overflow:hidden}
.floater{position:absolute;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:12.5px;box-shadow:var(--card-shadow);color:var(--ink)}
.floater.sq{border-radius:16px;padding:0;width:44px;height:44px;justify-content:center;color:#fff}

.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));position:relative;z-index:20}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;padding:4px 0;font-size:11.5px;font-weight:800;color:var(--ink-2)}
.tab[aria-current="page"]{color:var(--brand-strong)}
.tab[aria-current="page"] .ic{stroke-width:2.5}
.tab.score{color:var(--brand-strong)}
.tab.score .pl{width:54px;height:54px;border-radius:50%;background:var(--g-brand);color:#fff;display:grid;place-items:center;margin-top:-26px;border:4px solid var(--surface);box-shadow:0 6px 14px rgba(45,106,79,.4)}
.fab{position:absolute;right:14px;bottom:88px;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 30% 25%,#D4A017,#2D6A4F);color:#fff;font-weight:800;font-size:13px;letter-spacing:.05em;z-index:30;box-shadow:0 0 0 5px rgba(45,106,79,.22),0 10px 20px rgba(45,106,79,.45);display:grid;place-items:center}

.ring{position:relative;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring-bg{fill:none;stroke:var(--line)}
.ring-fg{fill:none;stroke:var(--t);stroke-linecap:round}
.ring-n{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-n b{font:700 40px/1 var(--display);color:var(--ring-ink,var(--ink))}
.ring-n span{font-size:12px;color:var(--ring-ink2,var(--ink-2));margin-top:2px}
.ring.sm .ring-n b{font-size:28px}
.frow{display:grid;grid-template-columns:1fr auto;gap:5px 10px;align-items:center}
.frow .nm{font-weight:700;font-size:14px}
.frow .val{font-weight:800;font-size:14px}
.bar{grid-column:1/-1;height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--t)}
.qbox{border-radius:22px;background:var(--surface);padding:14px 16px;color:var(--ink);font-size:14.5px;box-shadow:var(--card-shadow);position:relative}
.qbox .eyebrow{color:var(--brand-strong);display:flex;gap:6px;align-items:center;margin-bottom:6px}

.mapbox{position:relative;background:var(--map-land);overflow:hidden}
.mapbox svg.bg{display:block;width:100%;height:100%}
.pin{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.3);padding:0}
.pin .ic{width:16px;height:16px}
.pin.p-eco{background:#2D6A4F}.pin.p-hotel{background:#40916C}.pin.p-umkm{background:#D4A017}.pin.p-village{background:#7A3FD1}.pin.p-guide{background:#B36A00}.pin.p-refill{background:#0EA5E9}.pin.p-rep{background:#B36A00}
.pin.p-rep.ver{background:#15803D}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:0 -8px 28px rgba(20,36,28,.16);z-index:8;max-height:78%;overflow:auto;padding:6px 16px 18px}
.grab{width:100%;height:28px;border:0;background:none;display:grid;place-items:center}
.grab i{width:44px;height:5px;border-radius:9px;background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend svg{width:34px;height:8px}

.tile{width:100%;aspect-ratio:16/10;border-radius:16px;display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}
.hscroll>*{flex:none}
.pcard{width:170px;padding:0;overflow:hidden;position:relative;border-radius:24px}
.pcard .scene{height:104px;position:relative;overflow:hidden}
.pcard .scene svg{display:block;width:100%;height:100%}
.pcard .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.pcard.pk{background:var(--tint-pink)}.pcard.mt{background:var(--tint-mint)}.pcard.lc{background:var(--tint-lilac)}.pcard.or{background:var(--tint-orange)}
.ribbon{position:absolute;top:10px;left:0;background:#15803D;color:#fff;font:800 10.5px/1 var(--font);padding:5px 10px 5px 8px;border-radius:0 9px 9px 0;letter-spacing:.06em;z-index:2}
.plus{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:0;display:grid;place-items:center;flex:none}
.stars{display:flex;gap:2px;color:var(--gold)}
.stars .ic{fill:currentColor}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.stepper li{display:flex;gap:12px;position:relative;padding-bottom:14px}
.stepper li:last-child{padding-bottom:0}
.stepper li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper .dot{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;flex:none;z-index:1;font-size:12px;font-weight:800}
.stepper li.done .dot{background:var(--safe);color:#fff}
.stepper li.now .dot{background:var(--g-brand);color:#fff}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:14px 0}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-2)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.keys button{height:60px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font:600 24px var(--display)}
.holdwrap{position:relative;width:200px;height:200px;margin:0 auto}
.holdwrap svg{position:absolute;inset:0;width:100%;height:100%}
.hold{position:absolute;inset:16px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 25%,#D4A017,#2D6A4F);color:#fff;font:600 36px/1 var(--display);letter-spacing:.04em;display:grid;place-content:center;gap:4px;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.hold small{font:700 12.5px var(--font);letter-spacing:0}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .3s}
.bob{animation:bob 3.2s ease-in-out infinite}
.an li{opacity:.35;animation:doneStep .4s forwards}
.an li:nth-child(1){animation-delay:.4s}.an li:nth-child(2){animation-delay:1s}.an li:nth-child(3){animation-delay:1.6s}.an li:nth-child(4){animation-delay:2.2s}.an li:nth-child(5){animation-delay:2.8s}
@keyframes doneStep{to{opacity:1}}
.an li .ic{color:var(--brand)}
.an li{display:flex;gap:10px;align-items:center;font-weight:700}
.story{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 20px 20px;color:var(--ink);background:#FFFFFF;overflow:hidden}
.story .bars{display:flex;gap:5px;position:relative;z-index:2}
.story .bars i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.story .bars i.on{background:var(--brand)}
.story .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:rise .4s;position:relative;z-index:2}
.story .big{font:600 68px/1 var(--display)}
.story .btn.ghost{color:var(--ink);border-color:var(--line);background:var(--surface)}
.story .btn.primary{background:var(--brand);color:#fff;box-shadow:none}
.story .stat{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding:10px 0}
.story .stat b{font:600 46px/1 var(--display);min-width:88px}
.story .mascot{position:absolute;right:-24px;bottom:110px;width:170px;height:170px;opacity:.28;z-index:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.an li{opacity:1}}

.btn,.chip,.badge,.tab,.eyebrow,.seg button,.sospill,.lbl,.field label,.li b,.h3,.floater,.quick button,.ribbon,.fab,.hold,.index h3,.index .links button{font-family:var(--display)}
.btn{font-weight:700}
.meter{width:100%}
.m-top{display:flex;align-items:baseline;gap:5px}
.m-n{font:700 58px/1 var(--display);letter-spacing:-.03em}
.m-of{font:600 15px var(--display);color:var(--ink-2)}
.m-scale{position:relative;display:flex;gap:3px;height:10px;margin:12px 0 6px}
.m-seg{border-radius:99px;opacity:.3}
.m-seg.risk{background:var(--risk)}.m-seg.caution{background:var(--caution)}.m-seg.fair{background:var(--fair)}.m-seg.safe{background:var(--safe)}
.m-seg.act{opacity:1}
.m-mark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 1px 4px rgba(20,36,28,.3)}
.m-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2)}
.meter.sm .m-n{font-size:32px}.meter.sm .m-of{font-size:12px}.meter.sm .m-scale{height:6px;margin:8px 0 4px}.meter.sm .m-mark{width:12px;height:12px;margin:-6px 0 0 -6px;border-width:2.5px}.meter.sm .m-lbl{display:none}
.meter.on-dark .m-n{color:#fff}.meter.on-dark .m-of,.meter.on-dark .m-lbl{color:rgba(255,255,255,.9)}
.meter.on-dark .m-seg{background:#fff;opacity:.38}.meter.on-dark .m-seg.act{opacity:1}
.meter.on-dark .m-mark{background:var(--brand);border-color:#fff}
.bar{height:8px}

.score-hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-strong) 100%);color:#fff;border-radius:24px;padding:22px 18px;position:relative;overflow:hidden}
.score-hero .score-n{font:700 56px/1 var(--display);letter-spacing:-.02em}
.challenge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface-2);border:0;width:100%;text-align:left}
.challenge.done{background:var(--brand-soft)}
.challenge .chk{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none;border:2px solid var(--line)}
.challenge.done .chk{background:var(--brand);color:#fff;border-color:var(--brand)}
.points-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:#8A6A0F;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}

 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">Businesses supported</p><h1 class="big">6</h1><p style="font-size:17px;opacity:.9">local businesses · 3 local guides booked. Your choices put money back into the community.</p>`,
 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">Your impact</p><div><div class="stat"><b>−12.4</b><span>kg CO₂e saved</span></div><div class="stat"><b>84</b><span>avg. sustainability score</span></div></div>`,
 ()=>`<p class="eyebrow" style="color:var(--brand-strong)">Your travel personality</p><h1 class="big" style="font-size:52px">The Conscious Explorer</h1><p style="font-size:17px;opacity:.9">You like culture, unhurried time, and light-footprint routes.</p>`];
def('wr','I','Lestari Wrapped',{tone:'story',fab:false,html:()=>`<div class="story"><svg class="mascot" width="170" height="170" viewBox="0 0 100 100" aria-hidden="true" style="position:absolute;right:-24px;bottom:110px;opacity:.28"><use href="#i-logo"/></svg><div class="bars" role="img" aria-label="Slide ${st.story+1} of 5">${WR.map((_,i)=>`<i class="${i<=st.story?'on':''}"></i>`).join('')}</div><div class="row between" style="padding:8px 0"><span class="small" style="opacity:.8">2026</span><button class="ibtn" type="button" data-go="profile" aria-label="Close">${I('x')}</button></div>
  <div class="body">${WR[st.story]()}</div><div class="stack" style="gap:10px">${st.story===4?btn('See 3 matching guides','guides','primary','users'):''}<div class="row">${btn('Previous','','ghost','cl','data-act="story" data-v="-1"'+(st.story===0?' disabled':''))}${st.story<4?btn('Next','','primary','cr','data-act="story" data-v="1"'):btn('Share','','ghost','share','data-act="toast" data-v="Wrapped card copied (example)"')}</div></div></div>`});
def('set','I','Settings',{html:()=>`${hdr('Settings')}<div class="pad stack lg"><section class="stack"><h2 class="h2">General</h2><div class="card list"><div class="li"><span class="ico">${I('globe')}</span><span class="grow"><b class="small">Language</b><br><span class="muted xs">English</span></span>${I('cr','sm')}</div>
  </div></section>
  <section class="stack"><h2 class="h2">Privacy & impact</h2><div class="card list"><div class="li"><span class="grow"><b class="small">Share location with contacts during trips</b></span>${toggle('s1',true,'Share location during trips')}</div><div class="li"><span class="grow"><b class="small">Send reports anonymously</b></span>${toggle('s2',true,'Anonymous reports')}</div><div class="li"><span class="grow"><b class="small">Blur report location (±150 m)</b></span>${toggle('s3',true,'Blur location')}</div><div class="li"><span class="grow"><b class="small">Show my impact on my public profile</b></span>${toggle('s7',false,'Public impact')}</div></div></section>
  <section class="stack"><h2 class="h2">Notifications</h2><div class="card list"><div class="li"><span class="grow"><b class="small">Check-in reminders</b></span>${toggle('s4',true,'Check-in reminders')}</div><div class="li"><span class="grow"><b class="small">Impact alerts in your area</b></span>${toggle('s5',true,'Impact alerts')}</div><div class="li"><span class="grow"><b class="small">Promotions and news</b></span>${toggle('s6',false,'Promotions')}</div></div></section>
  ${btn('Log out','splash','ghost','logout')}</div>`});

/* ---------- engine ---------- */
const FLOWS={A:'A · Onboarding & Auth',B:'B · Home',C:'C · Plan Trip / AI',D:'D · Lestari Map',E:'E · Trip Monitoring',F:'F · Report Issue',G:'G · Community',H:'H · Guide',I:'I · Profile & Wrapped',J:'J · Score Dashboard'};
const NAV=[['home','home','Home'],['plan1','route','Plan'],['score','leaf','Score'],['community','users','Community'],['trips','bag','Trip']];
function buildIndex(){let h=`<h2>Lestari</h2><p class="sub">Clickable prototype · all sample data.</p>`;
  Object.keys(FLOWS).forEach(f=>{h+=`<h3>${FLOWS[f]}</h3><div class="links">${Object.values(S).filter(s=>s.flow===f).map(s=>`<button type="button" data-jump="${s.id}" aria-current="${s.id===st.cur}">${s.name}</button>`).join('')}</div>`});$('#index').innerHTML=h}
function buildTabs(){const cur=S[st.cur].tab;$('#tabbar').innerHTML=NAV.map(([g,ic,l])=>{const c=g==='score',on=g==='plan1'?cur==='plan':cur===g;return `<button class="tab ${c?'score':''}" type="button" data-go="${g}" ${on?'aria-current="page"':''}>${c?`<span class="pl">${I(ic,'lg')}</span>`:I(ic,'lg')}<span>${l}</span></button>`}).join('')}
function render(keep){const s=S[st.cur],v=$('#view'),y=keep?v.scrollTop:0;v.innerHTML=s.html();$('#tabbar').hidden=!s.nav;$('#fab').hidden=!(s.fab);$('#phone').dataset.tone=s.tone||'';if(s.nav)buildTabs();v.scrollTop=y;s.after&&s.after();document.querySelectorAll('[data-jump]').forEach(b=>b.setAttribute('aria-current',b.dataset.jump===st.cur))}
function go(id,o={}){if(!S[id])return;clearT();if(!o.replace&&!o.noHist)st.hist.push(st.cur);if(S[id].nav&&!o.keepHist&&NAV.some(n=>n[0]===id))st.hist=[];st.cur=id;if(id==='ci')st.esc=0;if(id==='wr')st.story=0;if(id==='report1')st.reportCat='waste';render();$('#view').focus({preventScroll:true})}
function back(){clearT();const p=st.hist.pop();st.cur=p||'home';render();}
function toast(m){const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${I('check','sm')}<span>${m}</span></div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>h.innerHTML='',2600)}
function setTheme(t){st.theme=t==='auto'?null:t;const r=document.documentElement;if(st.theme)r.dataset.theme=st.theme;else r.removeAttribute('data-theme');try{localStorage.setItem('ls-theme',t)}catch(e){}}
document.addEventListener('click',e=>{
  const j=e.target.closest('[data-jump]');if(j){st.hist=[];go(j.dataset.jump,{noHist:true});$('#index').classList.remove('open');return}
  if(e.target.closest('#idxBtn')){$('#index').classList.toggle('open');return}
  const b=e.target.closest('[data-back]');if(b){back();return}
  const a=e.target.closest('[data-act]');
  if(a){const v=a.dataset.v,k=a.dataset.act;
    if(k==='toast'){toast(v);if(a.dataset.go)go(a.dataset.go);return}
    if(k==='copy'){try{navigator.clipboard.writeText(v).then(()=>toast('Link copied'),()=>toast('Press and hold to copy: '+v))}catch(er){toast(v)}return}
    if(k==='authtab'){st.authTab=v;render(true);return}
    if(k==='showpw'){const p=$('#pw');p.type=p.type==='password'?'text':'password';a.textContent=p.type==='password'?'Show password':'Hide password';return}
    if(k==='ret'){st.ret=v;render(true);return}
    if(k==='view'){st.view=v;render(true);return}
    if(k==='layer'){st.layers.has(v)?st.layers.delete(v):st.layers.add(v);render(true);return}
    if(k==='sheet'){st.sheet=!st.sheet;render(true);return}
    if(k==='ttab'){st.tripTab=v;render(true);return}
    if(k==='esc'){st.esc=Math.min(4,st.esc+1);render(true);return}
    if(k==='cat'){st.cat=v;render(true);return}
    if(k==='post'){st.post=v;go('pd');return}
    if(k==='guide'){st.guide=v;go('gp');return}
    if(k==='svc'){st.svc=+v;render(true);return}
    if(k==='pay'){st.pay=+v;render(true);return}
    if(k==='story'){st.story=Math.max(0,Math.min(4,st.story+ +v));render(true);return}
    if(k==='rcat'){st.reportCat=v;render(true);return}
    if(k==='challenge'){const i=+v;st.challenges[i].done=!st.challenges[i].done;if(st.challenges[i].done)st.points+=st.challenges[i].p;else st.points-=st.challenges[i].p;render(true);toast(st.challenges[i].done?'Challenge complete! +'+st.challenges[i].p+' points':'Challenge reset');return}
    if(k==='rate'){a.parentElement.querySelectorAll('[data-act=rate]').forEach(x=>{const on=+x.dataset.v<=+v;x.setAttribute('aria-pressed',x===a);x.querySelector('.ic').style.fill=on?'currentColor':'none'});return}
    if(k==='theme'){setTheme(v==='next'?((st.theme||'auto')==='dark'?'light':'dark'):v);if(st.cur==='set')render(true);return}
  }
  const p=e.target.closest('[data-pick]');
  if(p){const g=p.closest('[data-group]');if(g){if(g.dataset.group==='many')p.setAttribute('aria-pressed',p.getAttribute('aria-pressed')!=='true');else g.querySelectorAll('[data-pick]').forEach(x=>x.setAttribute('aria-pressed',x===p))}return}
  const t=e.target.closest('[data-toggle]');if(t){t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true');return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
});
try{const t=localStorage.getItem('ls-theme');if(t&&t!=='auto')setTheme(t)}catch(e){}
buildIndex();render();
</script>
